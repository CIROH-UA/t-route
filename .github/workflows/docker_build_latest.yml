name: Build Pull Request Test Image

on:
  push:
    branches:
      - ngiab

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Build and Push Docker
        uses: ./.github/actions/docker-build
        with:
          docker-tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/t-route:latest
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          buildcloud-endpoint: ${{ secrets.BUILDCLOUD_ENDPOINT }}

  test-V4-image:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Update helper script
        shell: bash
        run: sed -i 's/"troute"/"${{ secrets.DOCKERHUB_USERNAME }}\/t-route:latest"/g' ./docker/troute.sh

        # just test what's used in ngiab to save build minutes
      - name: Run V4 Test on HYFeature without DA
        continue-on-error: true
        run: docker/troute.sh -V4 -f test/LowerColorado_TX_v4/test_AnA_V4_HYFeature_noDA.yaml
