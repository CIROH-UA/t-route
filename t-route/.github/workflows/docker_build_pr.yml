name: Build Pull Request Test Image

on:
  pull_request:
    branches:
      - ngiab
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Build and Push Docker
        uses: ./.github/actions/docker-build
        with:
          docker-tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/t-route:${{ github.event.pull_request.number }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          buildcloud-endpoint: ${{ secrets.BUILDCLOUD_ENDPOINT }}

  all-tests-image:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Update helper script
        shell: bash
        run: sed -i 's/"troute"/"${{ secrets.DOCKERHUB_USERNAME }}\/t-route:${{ github.event.pull_request.number }}"/g' ./docker/troute.sh

      - name: Run LowerColorado Test
        continue-on-error: true  # Continue with the next steps even if this step fails
        run: docker/troute.sh -V3 -f test/LowerColorado_TX/test_AnA.yaml

      - name: Run V4 Test on NHD
        continue-on-error: true
        run: docker/troute.sh -V4 -f test/LowerColorado_TX/test_AnA_V4_NHD.yaml

      - name: Run V4 Test on HYFeature
        continue-on-error: true
        run: docker/troute.sh -V4 -f test/LowerColorado_TX_v4/test_AnA_V4_HYFeature.yaml

      - name: Run V4 Test on HYFeature without DA
        continue-on-error: true
        run: docker/troute.sh -V4 -f test/LowerColorado_TX_v4/test_AnA_V4_HYFeature_noDA.yaml
